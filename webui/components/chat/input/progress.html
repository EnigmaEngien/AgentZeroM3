<html>

    </script>

    <div class="notch-wrap">

            z-index: 1000;
        }

        /* Match Desktop Floating Input dimensions */
        @media (min-width: 769px) {
            .notch-wrap {

                width: calc(100% - 100px);
                margin: 0 auto;
            }
        }


        #progress-bar-box {
            background-color: transparent;
            padding: 1 1;

            display: flex;
            justify-content: space-between;

            color: transparent;
