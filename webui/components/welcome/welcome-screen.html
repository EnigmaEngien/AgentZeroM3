<html>

<head>
    <script type="module">
        import { store } from "/components/welcome/welcome-store.js";
    </script>
</head>

<body>
    <div x-data x-show="$store.welcomeStore && $store.welcomeStore.isVisible">
        <template x-if="$store.welcomeStore">
            <div x-data="$store.welcomeStore" class="welcome-container">
                <!-- Agent Zero Logo -->
                <div class="welcome-logo-container">
                    <img src="./public/darkSymbol.svg" alt="Agent Zero Logo" class="welcome-logo" />
                </div>

                <!-- Welcome Title -->
                <h1 class="welcome-title">Welcome to Agent Zero</h1>
                <p class="welcome-subtitle">
                    Start a new conversation or explore the features below.
                </p>

                <!-- Action Cards -->
                <div class="welcome-actions">
                    <div class="welcome-action-card" @click="executeAction('new-chat')">
                        <span class="material-symbols-outlined welcome-action-icon">add_circle</span>
                        <h3 class="welcome-action-title">New Chat</h3>
                        <p class="welcome-action-description">
                            Start a new conversation
                        </p>
                    </div>

                    <div class="welcome-action-card" @click="executeAction('projects')">
                        <span class="material-symbols-outlined welcome-action-icon">folder</span>
                        <h3 class="welcome-action-title">Projects</h3>
                        <p class="welcome-action-description">
                            Manage your projects
                        </p>
                    </div>
                    <div class="welcome-action-card" @click="executeAction('memory')">
                        <span class="material-symbols-outlined welcome-action-icon">memory</span>
                        <h3 class="welcome-action-title">Memory</h3>
                        <p class="welcome-action-description">
                            Open Memory Dashboard
                        </p>
                    </div>
                    <div class="welcome-action-card" @click="executeAction('settings')">
                        <span class="material-symbols-outlined welcome-action-icon">settings</span>
                        <h3 class="welcome-action-title">Settings</h3>
                        <p class="welcome-action-description">
                            Configure Agent Zero
                        </p>
                    </div>
                    <div class="welcome-action-card" @click="executeAction('website')">
                        <span class="material-symbols-outlined welcome-action-icon">language</span>
                        <h3 class="welcome-action-title">Visit Website</h3>
                        <p class="welcome-action-description">
                            Learn more about Agent Zero
                        </p>
                    </div>
                    <div class="welcome-action-card" @click="executeAction('github')">
                        <span class="material-symbols-outlined welcome-action-icon">code</span>
                        <h3 class="welcome-action-title">Visit GitHub</h3>
                        <p class="welcome-action-description">
                            View source code and documentation
                        </p>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <style>
        /* Welcome Screen - Material 3 Expressive */
        .welcome-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
            text-align: center;
            background-color: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            min-height: 100vh;
            font-family: var(--font-family-main);
            animation: welcomeFadeIn var(--duration-long2) var(--easing-emphasized);
        }

        @keyframes welcomeFadeIn {
            from {
                opacity: 0;
                transform: scale(0.98);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .welcome-logo-container {
            margin-bottom: 24px;
        }

        .welcome-logo {
            width: 120px;
            height: 120px;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.1));
        }

        .welcome-title {
            font-size: 3rem;
            /* Headline Large */
            font-weight: 400;
            margin: 0 0 16px 0;
            color: var(--md-sys-color-on-surface);
            letter-spacing: -0.5px;
        }

        .welcome-subtitle {
            font-size: 1.25rem;
            /* Body Large */
            margin: 0 0 48px 0;
            color: var(--md-sys-color-on-surface-variant);
            max-width: 600px;
            line-height: 1.5;
        }

        .welcome-actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            max-width: 900px;
            width: 100%;
        }

        .welcome-action-card {
            background-color: var(--md-sys-color-surface-container-low);
            border-radius: 28px;
            /* Expressive Shape */
            padding: 32px 24px;
            transition: all var(--duration-medium) var(--easing-standard);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 16px;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--md-sys-color-outline-variant);
        }

        /* State Layer */
        .welcome-action-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--md-sys-color-primary);
            opacity: 0;
            transition: opacity var(--duration-short) var(--easing-linear);
        }

        .welcome-action-card:hover {
            background-color: var(--md-sys-color-surface-container-high);
            transform: translateY(-4px);
            box-shadow: var(--elevation-2);
            border-color: var(--md-sys-color-primary);
        }

        .welcome-action-card:hover::before {
            opacity: 0.08;
        }

        .welcome-action-card:active::before {
            opacity: 0.12;
        }

        .welcome-action-icon {
            font-size: 2.5rem;
            color: var(--md-sys-color-primary);
            transition: transform var(--duration-medium) var(--easing-emphasized);
        }

        .welcome-action-card:hover .welcome-action-icon {
            transform: scale(1.1);
        }

        .welcome-action-title {
            font-size: 1.25rem;
            /* Title Large */
            font-weight: 500;
            margin: 0;
            color: var(--md-sys-color-on-surface);
        }

        .welcome-action-description {
            font-size: 0.875rem;
            /* Body Medium */
            color: var(--md-sys-color-on-surface-variant);
            margin: 0;
            line-height: 1.4;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .welcome-container {
                padding: 24px 16px;
            }

            .welcome-title {
                font-size: 2rem;
            }

            .welcome-actions {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .welcome-action-card {
                padding: 24px;
                flex-direction: row;
                text-align: left;
                gap: 20px;
                border-radius: 20px;
            }

            .welcome-action-icon {
                font-size: 2rem;
            }

            .welcome-action-card div {
                display: flex;
                flex-direction: column;
                gap: 4px;
            }
        }
    </style>
</body>

</html>
