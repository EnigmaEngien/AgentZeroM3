<html>

<head>
  <script type="module">
    import { store as sidebarStore } from "/components/sidebar/sidebar-store.js";
  </script>
  <!-- Wrapper composes existing sidebar components -->
</head>

<body>
  <div x-data>
    <template x-if="$store.sidebar">
      <div id="left-panel" class="panel" x-data :class="{'hidden': !$store.sidebar.isOpen}">
        <!--Sidebar upper elements-->
        <div class="left-panel-top">
          <!-- Top Section: Header Icons + Quick Actions -->
          <x-component path="sidebar/top-section/sidebar-top.html"></x-component>
          <!-- Chats List -->
          <div class="config-section" id="chats-section">
            <x-component path="sidebar/chats/chats-list.html"></x-component>
          </div>

          <!-- Tasks List -->
          <div class="config-section" id="tasks-section">
            <x-component path="sidebar/tasks/tasks-list.html"></x-component>
          </div>
        </div>
        <!--Sidebar lower elements-->
        <div class="left-panel-bottom">
          <x-component path="sidebar/bottom/sidebar-bottom.html"></x-component>
        </div>
      </div>
    </template>
  </div>

  <style>
    #left-panel {
      background-color: var(--md-sys-color-surface-container-low);
      border-right: 1px solid var(--md-sys-color-outline-variant, #49454F);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform var(--duration-medium) var(--easing-emphasized),
        margin-left var(--duration-medium) var(--easing-emphasized);
      width: 280px;
      /* M3 Standard Drawer Width */
      min-width: 280px;
      color: var(--md-sys-color-on-surface);
      user-select: none;
      -webkit-user-select: none;
      height: 100vh;
      overflow: hidden;
      z-index: 1000;
      border-radius: 0 28px 28px 0;
      /* Rounded corners on the right side */
    }

    #left-panel.hidden {
      margin-left: -280px;
    }

    .left-panel-top {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      margin-top: 4.5rem;
      /* Space for M3 header icons */
      padding: 0 var(--spacing-md);
    }

    .left-panel-bottom {
      position: relative;
      flex-shrink: 0;
      padding: var(--spacing-md);
      background-color: var(--md-sys-color-surface-container-low);
    }

    #chats-section {
      display: flex;
      flex-direction: column;
      min-height: 0;
      flex: 1 1 auto;
      overflow: hidden;
      margin-bottom: var(--spacing-md);
    }

    #tasks-section {
      display: flex;
      flex-direction: column;
      min-height: 0;
      flex: 0 0 auto;
      max-height: 40%;
      padding-top: var(--spacing-md);
      border-top: 1px solid var(--md-sys-color-outline-variant);
      overflow: hidden;
    }

    #chats-section>x-component,
    #chats-section>x-component>div[x-data],
    #tasks-section>x-component,
    #tasks-section>x-component>div[x-data],
    #tasks-section>x-component>div[x-data]>div[x-data] {
      display: contents;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--spacing-xs) var(--spacing-sm);
      color: var(--md-sys-color-on-surface);
      opacity: 0.9;
      font-weight: 500;
      letter-spacing: 0.1px;
      font-size: 0.75rem;
      /* M3 Label Small */
      text-transform: uppercase;
    }

    @media (max-width: 768px) {
      #left-panel {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        width: 320px !important;
        /* Larger for mobile drawer */
        min-width: 320px;
        z-index: 1003;
        box-shadow: 0 8px 12px rgba(0, 0, 0, 0.4);
        border-radius: 0 28px 28px 0;
        /* Expressive rounded mobile drawer */
      }

      #left-panel.hidden {
        margin-left: -320px;
      }
    }
  </style>
</body>

</html>
