<html>

<head>
  <script type="module">
    import { store } from "/components/sidebar/chats/chats-store.js";
  </script>
</head>

<body>
  <div x-data>
    <template x-if="$store.chats">
      <div class="chats-list-container" x-data>
        <h3 class="section-header">Chats</h3>
        <ul class="config-list chats-config-list" x-show="$store.chats.contexts.length > 0">
          <template x-for="context in $store.chats.contexts" :key="context.id">
            <li>
              <div :class="{'chat-container': true, 'chat-selected': context.id === $store.chats.selected}"
                @click="$store.chats.selectChat(context.id)">
                <div class="chat-list-button">
                  <span class="project-color-ball"
                    :style="context.project?.color ? { backgroundColor: context.project.color } : { border: '1px solid var(--color-border)' }"></span>
                  <span class="chat-name" :title="context.name ? context.name : 'Chat #' + context.no"
                    x-text="context.name ? context.name : 'Chat #' + context.no"></span>
                </div>
                <button class="edit-button" @click.stop="$store.chats.killChat(context.id)">X</button>
              </div>
            </li>
          </template>
        </ul>
        <div class="empty-list-message" x-show="$store.chats.contexts.length === 0">
          <p><i>No chats to list.</i></p>
        </div>
      </div>
    </template>
  </div>

  <style>
    .chats-list-container {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      margin-top: var(--spacing-sm);
    }

    .chats-config-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      scroll-behavior: smooth;
      list-style: none;
      padding: 0;
      margin: 0;
      scrollbar-width: none;
    }

    .chats-config-list::-webkit-scrollbar {
      display: none;
    }

    /* M3 Navigation Item Base */
    .chat-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 48px;
      margin-bottom: 4px;
      padding: 0 16px;
      border-radius: 24px;
      cursor: pointer;
      transition: background-color var(--duration-short) linear,
        transform var(--duration-short) var(--easing-standard);
      overflow: hidden;
      color: var(--md-sys-color-on-surface);
    }

    .chat-container:hover {
      background-color: color-mix(in srgb, var(--md-sys-color-on-surface-variant) 8%, transparent);
    }

    /* Selected State - M3 Primary Container */
    .chat-selected {
      background-color: var(--md-sys-color-primary-container) !important;
      color: var(--md-sys-color-on-primary-container) !important;
    }

    .chat-selected .chat-name {
      font-weight: 700;
    }

    .chat-list-button {
      display: flex;
      align-items: center;
      flex-grow: 1;
      min-width: 0;
      gap: 12px;
    }

    .project-color-ball {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .chat-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 0.875rem;
      /* M3 Label Large */
      letter-spacing: 0.1px;
    }

    /* Modern Delete Button */
    .edit-button {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: transparent;
      border: none;
      border-radius: 50%;
      color: inherit;
      opacity: 0.6;
      cursor: pointer;
      font-size: 14px;
      transition: all var(--duration-short) var(--easing-standard);
    }

    .edit-button:hover {
      background-color: color-mix(in srgb, currentColor 12%, transparent);
      opacity: 1;
    }

    .empty-list-message {
      padding: 24px;
      text-align: center;
      color: var(--md-sys-color-on-surface);
      opacity: 0.6;
      font-size: 0.8125rem;
    }
  </style>
</body>

</html>
